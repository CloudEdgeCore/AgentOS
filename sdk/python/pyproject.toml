[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos-runtime"
version = "1.1.0"
description = "Stable AgentOS Runtime Interface SDK"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "AgentOS maintainers"}]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Repository = "https://github.com/CloudEdgeCore/AgentOS"
Issues = "https://github.com/CloudEdgeCore/AgentOS/issues"

[tool.setuptools]
packages = ["agentos_runtime"]

[tool.setuptools.package-data]
agentos_runtime = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
