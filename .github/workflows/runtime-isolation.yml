# Runtime isolation drills: real Wasmtime and OCI/gVisor sandbox execution +
# cross-runtime-class takeover. These prove the kernel dispatches to real
# sandboxes (not just runtime-class labels) and that pool-aware re-placement
# works across runtime boundaries.
name: runtime-isolation-drills

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1" # weekly, Monday 03:23 UTC

permissions:
  contents: read

concurrency:
  group: runtime-isolation-drills
  cancel-in-progress: false

jobs:
  wasmtime-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_DB: agentos_test
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: agentos-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentos -d agentos_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      AGENTOS_TEST_DATABASE_URL: postgres://agentos:agentos-test-only@127.0.0.1:5432/agentos_test?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum

      - name: Set up Rust (Wasmtime provider)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - name: Build Wasmtime worker + conformance component
        run: |
          cargo build --release --manifest-path runtime/wasm/Cargo.toml
          cargo build --release --manifest-path runtime/wasm/Cargo.toml --bin component-fixture
          ./target/release/component-fixture --out tmp/wasm-components/hello.wasm

      - name: Run Wasmtime isolation and takeover drills
        run: |
          go test -tags=integration -count=1 -timeout 30m -v -run 'TestWasmtimeIsolation|TestWasmtimeTakeover' ./examples/devops-workflow/tests/e2e/

  oci-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_DB: agentos_test
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: agentos-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentos -d agentos_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      AGENTOS_TEST_DATABASE_URL: postgres://agentos:agentos-test-only@127.0.0.1:5432/agentos_test?sslmode=disable
      AGENTOS_RUN_OCI_DRILL: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum

      - name: Install containerd + gVisor (runsc)
        run: |
          # containerd
          sudo apt-get update
          sudo apt-get install -y containerd
          # gVisor (runsc) from GitHub releases (storage.googleapis.com is stale)
          (
            set -e
            RUNSC_VERSION=$(curl -fsSL https://api.github.com/repos/google/gvisor/releases/latest | grep tag_name | cut -d'"' -f4)
            curl -fsSL -o runsc "https://github.com/google/gvisor/releases/download/${RUNSC_VERSION}/runsc"
            curl -fsSL -o runsc.toml "https://github.com/google/gvisor/releases/download/${RUNSC_VERSION}/runsc.toml" || true
            chmod 555 runsc
            sudo mv runsc /usr/local/bin
            sudo mv runsc.toml /etc/containerd/runsc.toml || true
            sudo mkdir -p /etc/containerd
            sudo cp deploy/ci/containerd-config.toml /etc/containerd/config.toml
            sudo systemctl restart containerd
          )

      - name: Build agent-runtime image and import into containerd
        run: |
          docker build -t agentos-runtime:latest -f deploy/oci/agent-runtime/Dockerfile .
          docker save agentos-runtime:latest | sudo ctr -n agentos images import -

      - name: Build OCI worker
        run: |
          mkdir -p bin
          go build -o bin/agentos-runtime-oci ./cmd/agentos-runtime-oci

      - name: Run OCI/gVisor isolation and takeover drills
        run: |
          go test -tags=integration -count=1 -timeout 30m -v -run 'TestOCIIsolation|TestOCITakeover' ./examples/devops-workflow/tests/e2e/
