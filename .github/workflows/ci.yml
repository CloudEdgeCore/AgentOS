name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    runs-on: ubuntu-latest
    # The integration leg includes the v1.1 recovery and v1.2 workflow
    # acceptance suites. Each suite can legitimately run for more than Go's
    # default 10-minute package timeout under the race detector.
    timeout-minutes: 75
    services:
      postgres:
        # pgvector image: the v0.1 Memory slice (ADR-009) requires the vector
        # extension alongside FTS/pg_trgm.
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_DB: agentos_test
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: agentos-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentos -d agentos_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      AGENTOS_TEST_DATABASE_URL: postgres://agentos:agentos-test-only@127.0.0.1:5432/agentos_test?sslmode=disable
      AGENTOS_TEST_NATS_URL: nats://127.0.0.1:4222
      AGENTOS_WASMTIME_RUNTIME: ${{ github.workspace }}/target/debug/agentos-runtime-wasm
      AGENTOS_WASMTIME_PACKAGE_ROOT: ${{ github.workspace }}/target/conformance
      # v1.1 acceptance evidence: the e2e/single-agent suite launches the
      # real Python agent from the repository tree.
      AGENTOS_E2E_PYTHON: python3

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum

      - name: Start NATS JetStream
        run: docker run --detach --name agentos-nats --publish 4222:4222 nats:2.14.1-alpine@sha256:ea17b9b7f74279b9239cf65e5786c0133e9a7c353bf218d29004abf2e7a33181 --jetstream

      - name: Verify module graph
        run: go mod verify

      - name: Verify Runtime Protocol schema and generated bindings
        run: |
          export GOBIN="$RUNNER_TEMP/bin"
          export PATH="$GOBIN:$PATH"
          go install github.com/bufbuild/buf/cmd/buf@v1.72.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.0
          buf lint
          buf generate
          git diff --exit-code -- gen/go

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Verify stable release contracts and Python SDK
        run: |
          test "$(go run ./cmd/agentos version -json | jq -r .productVersion)" = "1.0.0.0"
          python3 -m compileall -q sdk/python/agentos_runtime adapters examples/agents
          (cd sdk/python && python3 -m unittest discover -s tests -v)
          python3 -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" sdk/python

      - name: Verify TypeScript SDK
        run: |
          npm --prefix sdk/typescript ci
          npm --prefix sdk/typescript test

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

      - name: Scan reachable Go vulnerabilities
        run: go tool govulncheck ./...

      - name: Unit tests with race detector
        run: go test -race -count=1 ./...

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy

      - name: Build Wasmtime provider
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo +1.97.1 build --bin agentos-runtime-wasm --locked

      - name: Build conformance component
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo +1.97.1 run --bin component-fixture --locked -- --out target/conformance/agent.wasm

      - name: PostgreSQL integration tests with race detector
        run: go test -race -tags=integration -count=1 -timeout 60m ./...

      - name: Build control-plane commands
        run: go build ./cmd/...

      # The OCI/gVisor provider is Linux-only at the executor layer and its
      # conformance leg needs a containerd + runsc host; this step guarantees
      # the linux build and unit tests (already run above with -race), and
      # puts the binary on PATH so an opt-in sandbox job can enable the
      # conformance leg with AGENTOS_OCI_CONTAINERD_NAMESPACE.
      - name: Build OCI/gVisor provider
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/agentos-runtime-oci" ./cmd/agentos-runtime-oci
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check Rust formatting
        run: cargo +1.97.1 fmt --all -- --check

      - name: Lint Wasmtime Provider
        run: cargo +1.97.1 clippy --workspace --all-targets --locked -- -D warnings

      - name: Test Wasmtime Provider
        run: cargo +1.97.1 test --workspace --locked

      - name: Audit Rust dependencies
        run: |
          cargo +1.97.1 install cargo-audit --version 0.22.2 --locked
          cargo +1.97.1 audit

  # v0.7 real-machine leg: containerd + runsc on a Linux host, environment
  # fingerprint, the OCI/gVisor conformance leg, and the Firecracker KVM
  # probe. GitHub-hosted runners have no /dev/kvm, so the probe reports
  # KVM-absent there by design; a self-hosted runner with KVM (label
  # agentos-kvm) runs the same leg without --allow-no-kvm.
  #
  # Runtime archives and workload images are immutable and integrity checked;
  # the job fails closed if the approved matrix no longer installs or boots.
  runtime-linux-leg:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_DB: agentos_test
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: agentos-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentos -d agentos_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      AGENTOS_TEST_DATABASE_URL: postgres://agentos:agentos-test-only@127.0.0.1:5432/agentos_test?sslmode=disable
      AGENTOS_OCI_CONTAINERD_NAMESPACE: agentos-ci
      AGENTOS_OCI_IMAGE: docker.io/library/alpine@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
      AGENTOS_OCI_RUNTIME_CONFIG: /etc/containerd/runsc.toml
      AGENTOS_OCI_SNAPSHOTTER: overlayfs
      CONTAINERD_ADDRESS: /run/agentos-containerd/containerd.sock
      CONTAINERD_VERSION: "2.2.7"
      CONTAINERD_SHA256: "91cd216ea26a1b8b512219d3f205375c967e7b7de4dae571bc3dd16bfacd34b5"
      RUNSC_TAG: "20260810.0"
      RUNSC_PLATFORM: systrap
      RUNSC_NETWORK: none
      # ctr emits a cgroupfs-style OCI path. The runsc systemd driver expects
      # systemd slice:prefix:name syntax, so use runsc's cgroupfs driver here.
      RUNSC_SYSTEMD_CGROUP: "false"
      # Apply the OCI seccomp profile inside gVisor's application kernel.
      RUNSC_OCI_SECCOMP: "true"
      FIRECRACKER_VERSION: "v1.9.0"
      FIRECRACKER_SHA256: "95c13740c7ca1a6dfb40e0f51cd0a9eefee1f223cd2c3538755d03c3a9ba5237"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum

      - name: Install pinned containerd and runsc
        run: sudo -E bash deploy/ci/setup-containerd-runsc.sh

      - name: Install pinned Firecracker
        run: sudo -E bash deploy/ci/install-firecracker.sh

      - name: Environment fingerprint
        run: bash deploy/ci/env-fingerprint.sh | tee runtime-fingerprint.txt

      - name: Upload runtime fingerprint
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-fingerprint
          path: runtime-fingerprint.txt

      - name: Build OCI/gVisor provider
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/agentos-runtime-oci" ./cmd/agentos-runtime-oci
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Pin and pull the conformance workload image
        run: ctr -n "$AGENTOS_OCI_CONTAINERD_NAMESPACE" images pull --snapshotter "$AGENTOS_OCI_SNAPSHOTTER" "$AGENTOS_OCI_IMAGE"

      - name: Assert OCI/gVisor isolation boundary
        run: sudo -E bash deploy/ci/runtime-isolation.sh

      - name: OCI/gVisor conformance leg
        run: sudo -E env "PATH=$PATH" go test -race -tags=integration -count=1 -run 'TestSameAgentVersionRunsOnBothProviders/oci' ./internal/runtime/control/...

      - name: Verify OCI orphan recovery and cleanup
        run: |
          leftovers="$(ctr -n "$AGENTOS_OCI_CONTAINERD_NAMESPACE" containers list -q | grep '^agentos-' || true)"
          if [ -n "$leftovers" ]; then
            echo "provider-owned containers remain after conformance:" >&2
            echo "$leftovers" >&2
            exit 1
          fi

      - name: Firecracker KVM probe
        run: bash deploy/ci/firecracker-smoke.sh --allow-no-kvm
