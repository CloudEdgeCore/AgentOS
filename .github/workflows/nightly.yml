name: nightly-production-evidence

on:
  schedule:
    - cron: "17 18 * * *"
    - cron: "41 17 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-production-evidence
  cancel-in-progress: false

jobs:
  scale-fuzz-and-live-model:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 18 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_DB: agentos_test
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: agentos-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentos -d agentos_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      AGENTOS_TEST_DATABASE_URL: postgres://agentos:agentos-test-only@127.0.0.1:5432/agentos_test?sslmode=disable
      AGENTOS_TEST_NATS_URL: nats://127.0.0.1:4222
      AGENTOS_REAL_MODEL_URL: ${{ vars.AGENTOS_REAL_MODEL_URL }}
      AGENTOS_REAL_MODEL_NAME: ${{ vars.AGENTOS_REAL_MODEL_NAME }}
      # Optional bearer token for keyed endpoints (vLLM behind an API gateway);
      # unset/empty means a keyless endpoint. Held only in the fenced provider
      # config; credential isolation is asserted by TestRealModelToolCalling.
      AGENTOS_REAL_MODEL_KEY: ${{ secrets.AGENTOS_REAL_MODEL_KEY }}
      AGENTOS_CAPACITY_TASKS: "100000"
      AGENTOS_V13_SCALE_TEST: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum

      - name: Start NATS JetStream
        run: docker run --detach --name agentos-nightly-nats --publish 4222:4222 nats:2.14.1-alpine@sha256:ea17b9b7f74279b9239cf65e5786c0133e9a7c353bf218d29004abf2e7a33181 --jetstream

      - name: Require the governed live-model target
        run: |
          test -n "$AGENTOS_REAL_MODEL_URL"
          test -n "$AGENTOS_REAL_MODEL_NAME"

      - name: Run scale and multi-tenant evidence
        run: |
          # 100k capacity baseline: throughput benchmark, measured without the
          # race detector (which distorts timing by 5-10×). The 10k PR gate
          # runs with -race inside the kernel CI for functional correctness.
          go test -tags=integration -count=1 -timeout 120m -run 'TestControlPlanePipelineCapacityBaseline' ./internal/kernel/store/postgres/
          go test -race -tags=integration -count=1 -timeout 120m -run 'TestV13DynamicSpawnScale10K|TestV12WorkflowScale|TestMultiTenant' ./internal/kernel/store/postgres ./e2e/workflows
          go test -race -count=1 -timeout 45m -run 'TestV13Orchestrates10KDynamicTasks' ./internal/kernel/workflow
          AGENTOS_RESEARCH_SCALE_100K=1 AGENTOS_E2E_RESEARCH_RUNS=10000 go test -tags=integration -count=1 -timeout 60m -run 'TestScale100kTasks' -v ./examples/devops-workflow/tests/e2e/

      - name: Run parser fuzz corpus and discovery
        run: |
          go test -run '^$' -fuzz '^FuzzDecodeManifest$' -fuzztime 60s ./internal/kernel/agentversion
          go test -run '^$' -fuzz '^FuzzDecodeWorkflowSpec$' -fuzztime 60s ./internal/kernel/workflow
          go test -run '^$' -fuzz '^FuzzParseRequest$' -fuzztime 60s ./internal/mcp
          go test -run '^$' -fuzz '^FuzzConsumeOpenAIStream$' -fuzztime 60s ./internal/kernel/model/provider

      - name: Run mandatory live-model acceptance
        # P0-02: the pattern must match both the v1.1 real-model suite and
        # TestRealModelToolCalling (which has no V11 prefix), so the nightly
        # log proves the real model→tool→model closed loop ran.
        run: go test -tags=integration -count=1 -run '^(TestV11RealModel|TestRealModelToolCalling)' -v ./e2e/single-agent/

  research-live-acceptance:
    # Multi-agent research acceptance against a real model and the real web
    # (implementation plan §15): LiveModel, LiveFull and LiveRecovery emit
    # §5 metrics plus schema-versioned evidence JSON, uploaded as an artifact.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 18 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_DB: agentos_test
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: agentos-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentos -d agentos_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      AGENTOS_TEST_DATABASE_URL: postgres://agentos:agentos-test-only@127.0.0.1:5432/agentos_test?sslmode=disable
      AGENTOS_RESEARCH_LIVE: "1"
      AGENTOS_RESEARCH_LIVE_WEB: "1"
      AGENTOS_RESEARCH_LIVE_GOAL: "Assess how agent runtime control planes evolved between 2023 and 2025 and what defines their next cycle"
      AGENTOS_RESEARCH_MODEL_BASE_URL: ${{ secrets.AGENTOS_RESEARCH_MODEL_BASE_URL }}
      AGENTOS_RESEARCH_MODEL_KEY: ${{ secrets.AGENTOS_RESEARCH_MODEL_KEY }}
      AGENTOS_RESEARCH_MODEL_PROVIDER: ${{ vars.AGENTOS_RESEARCH_MODEL_PROVIDER }}
      AGENTOS_RESEARCH_MODEL_FAST: ${{ vars.AGENTOS_RESEARCH_MODEL_FAST }}
      AGENTOS_RESEARCH_MODEL_READER: ${{ vars.AGENTOS_RESEARCH_MODEL_READER }}
      AGENTOS_RESEARCH_MODEL_REASONING: ${{ vars.AGENTOS_RESEARCH_MODEL_REASONING }}
      AGENTOS_RESEARCH_SEARCH_PROVIDER: ${{ vars.AGENTOS_RESEARCH_SEARCH_PROVIDER }}
      AGENTOS_RESEARCH_SEARCH_KEY: ${{ secrets.AGENTOS_RESEARCH_SEARCH_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum

      - name: Require live credentials or mark the run neutral
        id: credentials
        run: |
          if [ -z "$AGENTOS_RESEARCH_MODEL_BASE_URL" ] || [ -z "$AGENTOS_RESEARCH_SEARCH_KEY" ]; then
            echo "::notice::research-live secrets are not configured on this repository; the acceptance leg is skipped"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run gated live research acceptance
        if: steps.credentials.outputs.configured == 'true'
        run: >
          go test -tags=integration -count=1 -timeout 75m
          -run '^TestResearchWorkflowLive(Model|Full|Recovery)$' -v
          ./examples/research-workflow/tests/e2e/

      - name: Upload live evidence bundle
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research-live-evidence
          path: artifacts/research-live/*.json
          if-no-files-found: warn

  firecracker-kvm:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 18 * * *'
    runs-on: [self-hosted, Linux, X64, agentos-kvm]
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Assert real KVM and boot Firecracker
        run: |
          test -r /dev/kvm -a -w /dev/kvm
          bash deploy/ci/firecracker-smoke.sh

  soak-24h:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '41 17 * * 0'
    runs-on: [self-hosted, Linux, X64, agentos-soak]
    timeout-minutes: 1500
    env:
      AGENTOS_TEST_DATABASE_URL: ${{ secrets.AGENTOS_SOAK_DATABASE_URL }}
      AGENTOS_TEST_NATS_URL: ${{ secrets.AGENTOS_SOAK_NATS_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run recovery and orchestration acceptance continuously for 24 hours
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AGENTOS_TEST_DATABASE_URL"
          test -n "$AGENTOS_TEST_NATS_URL"
          deadline=$(( $(date +%s) + 86400 ))
          iterations=0
          while (( $(date +%s) < deadline )); do
            go test -race -tags=integration -count=1 -timeout 60m ./internal/kernel/store/postgres ./internal/kernel/recovery ./internal/kernel/workflow ./e2e/workflows
            iterations=$((iterations + 1))
          done
          test "$iterations" -gt 0
