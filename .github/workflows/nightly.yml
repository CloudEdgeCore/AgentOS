name: nightly-production-evidence

on:
  schedule:
    - cron: "17 18 * * *"
    - cron: "41 17 * * 0"
    - cron: "41 17 15 * *"
    - cron: "41 17 1 * *"
  workflow_dispatch:
    inputs:
      jobs:
        description: "Which evidence jobs to run (all = everything)"
        type: choice
        default: all
        options:
          - all
          - capacity-baseline
          - capacity-baseline-1m
          - scale-fuzz-and-live-model
          - research-live-acceptance
          - soak
      soak_hours:
        description: "Soak duration in hours (24 weekly, 72 monthly, 168 = 7d chunked)"
        type: choice
        default: "24"
        options:
          - "24"
          - "72"
          - "168"

permissions:
  contents: read

# Serialize runs per runner pool. Long evidence runs (multi-day soaks and
# the 1M baseline, which hold the self-hosted runner for hours) get their
# own group so they never delay the daily hosted nightly run, while
# simultaneous dispatches of the same class still queue instead of
# overlapping. Job-level concurrency is deliberately not used: GitHub
# cancels previously pending sibling jobs in the same group, which would
# cancel every queued job but one whenever a workflow run has several
# jobs sharing a group.
concurrency:
  group: >-
    ${{ ((github.event_name == 'schedule' && (github.event.schedule == '41 17 * * 0' || github.event.schedule == '41 17 15 * *' || github.event.schedule == '41 17 1 * *')) ||
         (github.event_name == 'workflow_dispatch' && (github.event.inputs.jobs == 'soak' || github.event.inputs.jobs == 'capacity-baseline-1m' || github.event.inputs.jobs == 'all')))
        && 'agentos-long-evidence' || 'nightly-production-evidence' }}
  cancel-in-progress: false

jobs:
  # Self-hosted evidence pool gate.
  #
  # The long-running evidence jobs below (1M capacity baseline, 24h/72h soak,
  # 7d soak) need the fixed-hardware self-hosted pool, because the <=10%
  # throughput / <=15% P95 stability gate in docs/benchmark/100k.md cannot be
  # certified on a shared hosted runner. When that pool is not provisioned,
  # GitHub leaves a job with no matching runner queued indefinitely: the run
  # never reaches a terminal state and reports neither pass nor failure.
  #
  # This gate turns "the pool is missing" into an explicit, terminal skip so
  # every run ends in a state an operator can act on (never a silent queue).
  #
  # Operator action: once the `agentos-soak` runner is online, set the
  # repository variable AGENTOS_SELF_HOSTED_PROVISIONED to "true". Until then
  # the self-hosted evidence jobs are skipped with a notice and never queue.
  runner-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      provisioned: ${{ steps.check.outputs.provisioned }}
    steps:
      - name: Check whether the self-hosted evidence pool is provisioned
        id: check
        env:
          AGENTOS_SELF_HOSTED_PROVISIONED: ${{ vars.AGENTOS_SELF_HOSTED_PROVISIONED }}
        run: |
          if [ "${AGENTOS_SELF_HOSTED_PROVISIONED}" = "true" ]; then
            echo "provisioned=true" >> "$GITHUB_OUTPUT"
            echo "self-hosted evidence pool (agentos-soak) declared provisioned"
          else
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
            echo "::notice::self-hosted evidence pool runs-on [self-hosted, Linux, X64, agentos-soak] is NOT provisioned. Skipping soak, soak-7d and capacity-baseline-1m instead of leaving them queued forever. Set the repository variable AGENTOS_SELF_HOSTED_PROVISIONED=true once the runner is online."
          fi

  # 100k capacity baseline: throughput benchmark, measured WITHOUT the race
  # detector (which distorts timing by 5-10x). Kept as its own job so it can
  # be dispatched alone (`-f jobs=capacity-baseline`) and never depends on
  # live-model credentials. The 10k functional gate still runs with -race in
  # the scale job below.
  capacity-baseline:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.jobs == 'all' || github.event.inputs.jobs == 'capacity-baseline'))
    runs-on: ubuntu-latest
    timeout-minutes: 300
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_DB: agentos_test
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: agentos-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentos -d agentos_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      AGENTOS_TEST_DATABASE_URL: postgres://agentos:agentos-test-only@127.0.0.1:5432/agentos_test?sslmode=disable
      AGENTOS_CAPACITY_TASKS: "100000"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum

      - name: Run 100k capacity baseline
        run: go test -tags=integration -count=1 -timeout 240m -run 'TestControlPlanePipelineCapacityBaseline' -v ./internal/kernel/store/postgres/

      - name: Upload capacity evidence log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capacity-baseline-evidence
          path: /tmp/capacity-evidence.txt
          if-no-files-found: warn

  # 1M capacity baseline: dispatch-only, runs on self-hosted runner because
  # GitHub hosted runners have a 360 min job timeout cap. The pipeline is
  # expected to need 8-13h (100k takes 1-1.4h), so the job allows 20h and
  # the go test timeout allows 18h.
  capacity-baseline-1m:
    needs: runner-preflight
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.event.inputs.jobs == 'all' || github.event.inputs.jobs == 'capacity-baseline-1m') &&
      needs.runner-preflight.outputs.provisioned == 'true'
    runs-on: [self-hosted, Linux, X64, agentos-soak]
    timeout-minutes: 1200
    env:
      AGENTOS_TEST_DATABASE_URL: ${{ secrets.AGENTOS_SOAK_DATABASE_URL }}
      AGENTOS_CAPACITY_TASKS: "1000000"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum
      - name: Run 1M capacity baseline
        run: go test -tags=integration -count=1 -timeout 1080m -run 'TestControlPlanePipelineCapacityBaseline' -v ./internal/kernel/store/postgres/
      - name: Upload capacity evidence log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: capacity-baseline-1m-evidence
          path: /tmp/capacity-evidence.txt
          if-no-files-found: warn

  scale-fuzz-and-live-model:
    if: github.event_name == 'schedule' && github.event.schedule == '17 18 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.jobs == 'all' || github.event.inputs.jobs == 'scale-fuzz-and-live-model'))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_DB: agentos_test
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: agentos-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentos -d agentos_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      AGENTOS_TEST_DATABASE_URL: postgres://agentos:agentos-test-only@127.0.0.1:5432/agentos_test?sslmode=disable
      AGENTOS_TEST_NATS_URL: nats://127.0.0.1:4222
      AGENTOS_REAL_MODEL_URL: ${{ vars.AGENTOS_REAL_MODEL_URL }}
      AGENTOS_REAL_MODEL_NAME: ${{ vars.AGENTOS_REAL_MODEL_NAME }}
      # Optional bearer token for keyed endpoints (vLLM behind an API gateway);
      # unset/empty means a keyless endpoint. Held only in the fenced provider
      # config; credential isolation is asserted by TestRealModelToolCalling.
      AGENTOS_REAL_MODEL_KEY: ${{ secrets.AGENTOS_REAL_MODEL_KEY }}
      AGENTOS_V13_SCALE_TEST: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum

      - name: Start NATS JetStream
        run: docker run --detach --name agentos-nightly-nats --publish 4222:4222 nats:2.14.1-alpine@sha256:ea17b9b7f74279b9239cf65e5786c0133e9a7c353bf218d29004abf2e7a33181 --jetstream

      - name: Require the governed live-model target
        run: |
          test -n "$AGENTOS_REAL_MODEL_URL"
          test -n "$AGENTOS_REAL_MODEL_NAME"

      - name: Probe the live-model endpoint
        # One-token completion directly against the provider: distinguishes
        # "the endpoint can serve" (probe 200 -> the acceptance suite below
        # runs and real regressions still fail the nightly) from "the endpoint
        # is unavailable" (quota exhausted / unreachable -> skip with a loud
        # warning instead of burning the nightly red on an external outage).
        id: live-probe
        run: |
          auth=(-H 'Content-Type: application/json')
          if [ -n "${AGENTOS_REAL_MODEL_KEY:-}" ]; then
            auth+=(-H "Authorization: Bearer $AGENTOS_REAL_MODEL_KEY")
          fi
          code=$(curl -sS -o /tmp/live-probe.json -w '%{http_code}' --max-time 60 \
            "${auth[@]}" \
            -d "{\"model\":\"$AGENTOS_REAL_MODEL_NAME\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}],\"max_tokens\":1}" \
            "$AGENTOS_REAL_MODEL_URL/chat/completions") || code=000
          if [ "$code" = "200" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::live model endpoint answered HTTP $code; live-model acceptance is skipped until the endpoint serves again (quota exhausted or unreachable). External outage, not a code regression."
            cat /tmp/live-probe.json 2>/dev/null || true
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run functional scale and multi-tenant evidence
        run: |
          go test -race -tags=integration -count=1 -timeout 120m -run 'TestV13DynamicSpawnScale10K|TestV12WorkflowScale|TestMultiTenant' ./internal/kernel/store/postgres ./e2e/workflows
          go test -race -count=1 -timeout 45m -run 'TestV13Orchestrates10KDynamicTasks' ./internal/kernel/workflow
          AGENTOS_RESEARCH_SCALE_100K=1 AGENTOS_E2E_RESEARCH_RUNS=10000 go test -tags=integration -count=1 -timeout 60m -run 'TestScale100kTasks' -v ./examples/devops-workflow/tests/e2e/

      - name: Run parser fuzz corpus and discovery
        run: |
          go test -run '^$' -fuzz '^FuzzDecodeManifest$' -fuzztime 60s ./internal/kernel/agentversion
          go test -run '^$' -fuzz '^FuzzDecodeWorkflowSpec$' -fuzztime 60s ./internal/kernel/workflow
          go test -run '^$' -fuzz '^FuzzParseRequest$' -fuzztime 60s ./internal/mcp
          go test -run '^$' -fuzz '^FuzzConsumeOpenAIStream$' -fuzztime 60s ./internal/kernel/model/provider

      - name: Run mandatory live-model acceptance
        # P0-02: the pattern must match both the v1.1 real-model suite and
        # TestRealModelToolCalling (which has no V11 prefix), so the nightly
        # log proves the real model→tool→model closed loop ran. Mandatory
        # whenever the endpoint probe above confirms the provider can serve;
        # skipped with a warning only on external unavailability.
        if: steps.live-probe.outputs.available == 'true'
        run: go test -tags=integration -count=1 -run '^(TestV11RealModel|TestRealModelToolCalling)' -v ./e2e/single-agent/

  research-live-acceptance:
    # Multi-agent research acceptance against a real model and the real web
    # (implementation plan §15): LiveModel, LiveFull and LiveRecovery emit
    # §5 metrics plus schema-versioned evidence JSON, uploaded as an artifact.
    if: github.event_name == 'schedule' && github.event.schedule == '17 18 * * *' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.jobs == 'all' || github.event.inputs.jobs == 'research-live-acceptance'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: pgvector/pgvector:pg18@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
        env:
          POSTGRES_DB: agentos_test
          POSTGRES_USER: agentos
          POSTGRES_PASSWORD: agentos-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentos -d agentos_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      AGENTOS_TEST_DATABASE_URL: postgres://agentos:agentos-test-only@127.0.0.1:5432/agentos_test?sslmode=disable
      AGENTOS_RESEARCH_LIVE: "1"
      AGENTOS_RESEARCH_LIVE_WEB: "1"
      AGENTOS_RESEARCH_LIVE_GOAL: "Assess how agent runtime control planes evolved between 2023 and 2025 and what defines their next cycle"
      AGENTOS_RESEARCH_MODEL_BASE_URL: ${{ secrets.AGENTOS_RESEARCH_MODEL_BASE_URL }}
      AGENTOS_RESEARCH_MODEL_KEY: ${{ secrets.AGENTOS_RESEARCH_MODEL_KEY }}
      AGENTOS_RESEARCH_MODEL_PROVIDER: ${{ vars.AGENTOS_RESEARCH_MODEL_PROVIDER }}
      AGENTOS_RESEARCH_MODEL_FAST: ${{ vars.AGENTOS_RESEARCH_MODEL_FAST }}
      AGENTOS_RESEARCH_MODEL_READER: ${{ vars.AGENTOS_RESEARCH_MODEL_READER }}
      AGENTOS_RESEARCH_MODEL_REASONING: ${{ vars.AGENTOS_RESEARCH_MODEL_REASONING }}
      AGENTOS_RESEARCH_SEARCH_PROVIDER: ${{ vars.AGENTOS_RESEARCH_SEARCH_PROVIDER }}
      AGENTOS_RESEARCH_SEARCH_KEY: ${{ secrets.AGENTOS_RESEARCH_SEARCH_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache-dependency-path: go.sum

      - name: Require live credentials or mark the run neutral
        id: credentials
        run: |
          if [ -z "$AGENTOS_RESEARCH_MODEL_BASE_URL" ] || [ -z "$AGENTOS_RESEARCH_SEARCH_KEY" ]; then
            echo "::notice::research-live secrets are not configured on this repository; the acceptance leg is skipped"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # One-token completion against the research model: a non-200 means
          # the provider cannot serve (quota exhausted / unreachable), which
          # is an external outage — mark neutral with a loud warning instead
          # of failing the nightly. A 200 means the suite below runs and real
          # regressions still fail.
          code=$(curl -sS -o /tmp/research-probe.json -w '%{http_code}' --max-time 60 \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $AGENTOS_RESEARCH_MODEL_KEY" \
            -d "{\"model\":\"$AGENTOS_RESEARCH_MODEL_FAST\",\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}],\"max_tokens\":1}" \
            "$AGENTOS_RESEARCH_MODEL_BASE_URL/chat/completions") || code=000
          if [ "$code" = "200" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::research model endpoint answered HTTP $code; research live acceptance is skipped until the endpoint serves again (quota exhausted or unreachable). External outage, not a code regression."
            cat /tmp/research-probe.json 2>/dev/null || true
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run gated live research acceptance
        if: steps.credentials.outputs.configured == 'true'
        run: >
          go test -tags=integration -count=1 -timeout 75m
          -run '^TestResearchWorkflowLive(Model|Full|Recovery)$' -v
          ./examples/research-workflow/tests/e2e/

      - name: Upload live evidence bundle
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: research-live-evidence
          path: artifacts/research-live/*.json
          if-no-files-found: warn

  # Recovery and orchestration soak. Duration matrix:
  #   - weekly Sunday run "41 17 * * 0"   -> 24h
  #   - monthly 15th run "41 17 15 * *"   -> 72h
  #   - dispatch soak_hours                -> 24h / 72h / 168h
  # The 168h (7d) dispatch and the monthly 1st run are handled by soak-7d
  # below, because a self-hosted job is terminated after 5 days.
  # Long soaks use their own concurrency group so they no longer delay the
  # daily hosted nightly evidence run while the runner is busy.
  soak:
    needs: runner-preflight
    if: >-
      (github.event_name == 'schedule' && (github.event.schedule == '41 17 * * 0' || github.event.schedule == '41 17 15 * *')
      || (github.event_name == 'workflow_dispatch' && (github.event.inputs.jobs == 'all' || github.event.inputs.jobs == 'soak') && github.event.inputs.soak_hours != '168'))
      && needs.runner-preflight.outputs.provisioned == 'true'
    runs-on: [self-hosted, Linux, X64, agentos-soak]
    timeout-minutes: 4500
    env:
      AGENTOS_TEST_DATABASE_URL: ${{ secrets.AGENTOS_SOAK_DATABASE_URL }}
      AGENTOS_TEST_NATS_URL: ${{ secrets.AGENTOS_SOAK_NATS_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run recovery and orchestration acceptance continuously
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AGENTOS_TEST_DATABASE_URL"
          test -n "$AGENTOS_TEST_NATS_URL"
          hours=24
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            hours="${{ github.event.inputs.soak_hours }}"
          elif [ "${{ github.event.schedule }}" = "41 17 15 * *" ]; then
            hours=72
          fi
          echo "soak duration: ${hours}h"
          deadline=$(( $(date +%s) + hours * 3600 ))
          iterations=0
          while (( $(date +%s) < deadline )); do
            go test -race -tags=integration -count=1 -timeout 60m ./internal/kernel/store/postgres ./internal/kernel/recovery ./internal/kernel/workflow ./e2e/workflows
            iterations=$((iterations + 1))
            echo "soak iteration ${iterations} complete"
          done
          test "$iterations" -gt 0

  # 7-day soak: a single self-hosted job is terminated after 5 days, so the
  # month-start schedule and a soak_hours=168 dispatch run two sequential 84h
  # chunks (max-parallel: 1) on the same runner. A 1st-of-month run can
  # overlap the weekly 24h soak; the shared concurrency group serializes them.
  soak-7d:
    needs: runner-preflight
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '41 17 1 * *'
      || (github.event_name == 'workflow_dispatch' && (github.event.inputs.jobs == 'all' || github.event.inputs.jobs == 'soak') && github.event.inputs.soak_hours == '168'))
      && needs.runner-preflight.outputs.provisioned == 'true'
    runs-on: [self-hosted, Linux, X64, agentos-soak]
    timeout-minutes: 5100
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        chunk: [1, 2]
    env:
      AGENTOS_TEST_DATABASE_URL: ${{ secrets.AGENTOS_SOAK_DATABASE_URL }}
      AGENTOS_TEST_NATS_URL: ${{ secrets.AGENTOS_SOAK_NATS_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run recovery and orchestration acceptance for 84h (chunk ${{ matrix.chunk }}/2)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AGENTOS_TEST_DATABASE_URL"
          test -n "$AGENTOS_TEST_NATS_URL"
          deadline=$(( $(date +%s) + 84 * 3600 ))
          iterations=0
          while (( $(date +%s) < deadline )); do
            go test -race -tags=integration -count=1 -timeout 60m ./internal/kernel/store/postgres ./internal/kernel/recovery ./internal/kernel/workflow ./e2e/workflows
            iterations=$((iterations + 1))
            echo "soak chunk ${{ matrix.chunk }}/2 iteration ${iterations} complete"
          done
          test "$iterations" -gt 0
