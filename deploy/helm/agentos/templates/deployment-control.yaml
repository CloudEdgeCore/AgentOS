apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentos.fullname" . }}-control
  labels:
    app.kubernetes.io/name: agentos-control
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agentos-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentos-control
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: control
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/agentos-control"]
          args:
            - "-listen=0.0.0.0:{{ .Values.controlPlane.port }}"
            - "-dev-tenant={{ .Values.security.devTenant }}"
          ports:
            - containerPort: {{ .Values.controlPlane.port }}
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "agentos.fullname" . }}-db-secret
                  key: database-url
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
