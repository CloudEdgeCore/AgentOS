apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentos.fullname" . }}-control
  labels:
    app.kubernetes.io/name: agentos-control
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.controlPlane.service.type }}
  ports:
    - port: {{ .Values.controlPlane.service.port }}
      targetPort: https
      protocol: TCP
      name: https
  selector:
    {{- include "agentos.controlSelectorLabels" . | nindent 4 }}
